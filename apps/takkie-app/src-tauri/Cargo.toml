[package]
name = "takkie-app"
description = "local-takkie desktop and Android app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Android loads the app as a library; the desktop binary is a thin wrapper.
[lib]
name = "takkie_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
gethostname = { workspace = true }
serde = { workspace = true }
takkie-core = { workspace = true }
takkie-engine = { workspace = true }
tauri = { version = "2.12", features = [] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true

# Packaged by Tauri (E14), not by dist.
[package.metadata.dist]
dist = false
