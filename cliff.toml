# Builds CHANGELOG.md from Conventional Commits. See CONTRIBUTING.md, "Releasing".

[changelog]
header = """
# Changelog

All notable changes to local-takkie. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and versions follow
[Semantic Versioning](https://semver.org/).
"""
body = """

{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# The HTML comments only set the order of the sections.
commit_parsers = [
    { message = "^Merge", skip = true },
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^(refactor|perf|style)", group = "<!-- 2 -->Changed" },
    { message = "^docs", group = "<!-- 3 -->Documentation" },
    { message = "^test", group = "<!-- 4 -->Tests" },
    { message = "^ci", group = "<!-- 5 -->Build and CI" },
    { message = "^chore\\(deps\\)", group = "<!-- 6 -->Dependencies" },
    { message = "^chore", group = "<!-- 7 -->Maintenance" },
    { message = ".*", group = "<!-- 8 -->Other" },
]
