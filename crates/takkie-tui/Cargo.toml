[package]
name = "takkie-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "takkie"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossbeam-channel = { workspace = true }
crossterm = "0.29"
directories = "6"
gethostname = "1.1"
ratatui = "0.28"
takkie-core = { workspace = true }
takkie-engine = { path = "../takkie-engine" }
tracing = { workspace = true }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true

# Not published to crates.io, but released as downloadable binaries.
[package.metadata.dist]
dist = true
