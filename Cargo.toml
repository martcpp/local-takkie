[workspace]
members = ["crates/*", "xtask", "apps/takkie-app/src-tauri"]
# The GUI needs Node and, on Linux, WebKitGTK, so plain cargo commands skip it.
default-members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/martcpp/local-takkie"
publish = false

[workspace.dependencies]
crossbeam-channel = "0.5.17"
gethostname = "1.1"
serde = { version = "1", features = ["derive"] }
takkie-core = { path = "crates/takkie-core" }
takkie-engine = { path = "crates/takkie-engine" }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"

# Argon2 is unusably slow unoptimised; this keeps debug builds and tests quick.
[profile.dev.package.argon2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
