name: Fuzz

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: How long to fuzz, in seconds
        default: "600"
  pull_request:
    paths:
      - crates/takkie-core/fuzz/**
      - crates/takkie-core/src/protocol.rs

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decode-header:
    name: Fuzz decode_header
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates/takkie-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-fuzz
      # The prebuilt cargo-fuzz targets musl unless told otherwise, and the
      # sanitizer needs glibc.
      - name: Fuzz
        env:
          FUZZ_SECONDS: ${{ inputs.seconds || '600' }}
        run: |
          mkdir -p fuzz/corpus/decode_header
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu decode_header \
            fuzz/corpus/decode_header fuzz/seeds/decode_header \
            -- -max_total_time="$FUZZ_SECONDS"
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: crates/takkie-core/fuzz/artifacts
          if-no-files-found: ignore
