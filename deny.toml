[advisories]
yanked = "deny"
# Each exception names the ticket that removes it. Anything else fails.
ignore = [
    # Build-time macro helper of the GTK3 bindings Tauri 2 uses on Linux. #276
    { id = "RUSTSEC-2024-0370", reason = "no fix until Tauri drops GTK3 (#276)" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
exceptions = [
    { allow = ["MPL-2.0"], crate = "option-ext" },
    # Servo's CSS parser, pulled in by Tauri and used unmodified.
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "selectors" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates point at each other by path; they're never published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
