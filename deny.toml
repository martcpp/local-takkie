[advisories]
yanked = "deny"
# Each exception names the ticket that removes it. Anything else fails.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste (via ratatui 0.28) is unmaintained; #111 upgrades ratatui" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 (via local-ip-address) is unmaintained; #97 replaces local-ip-address" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates point at each other by path; they're never published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
